apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace : teamhub
spec:
  replicas : 2

  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: backend:latest
        imagePullPolicy : IfNotPresent

        ports :
          - containerPort: 5000
        env:
          - name : PORT
            valueFrom:
              configMapKeyRef:
                name : backend-config
                key: PORT

          - name: MONGO_URI
            value : mongodb://admin:admin123@mongodb-service:27017/EmployeeDB?authSource=admin
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            cpu: "500m"
            memory: "256Mi"
