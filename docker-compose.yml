services:

  mongodb:
    image: mongo:7
    container_name: teamhub-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - teamhub-network

  backend:
    build: ./backend
    container_name: teamhub-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/EmployeeDB?authSource=admin
    depends_on:
      - mongodb
    networks:
      - teamhub-network

  frontend:
    build: ./frontend
    container_name: teamhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - teamhub-network

volumes:
  mongodb_data:

networks:
  teamhub-network: